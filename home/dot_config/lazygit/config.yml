gui:
  theme:
    activeBorderColor:
      - green
      - bold
    inactiveBorderColor:
      - white
    selectedLineBgColor:
      - reverse
  nerdFontsVersion: "3"
  commitLength:
    show: true
git:
  paging:
    colorArg: always
    pager: delta --dark --paging=never --side-by-side --line-numbers
  skipHookPrefix: "WIP"
update:
  method: never
  days: 14
confirmOnQuit: false
os:
  editPreset: "helix"
  disableStartupPopups: true
