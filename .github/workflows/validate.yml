name: Validate devlab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: shellcheck setup.sh bootstrap.sh

  chezmoi-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: Render templates for both profiles
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          for profile in dc1 vps; do
            echo "=== profile: $profile ==="
            chezmoi execute-template \
              --init --promptString "profile=$profile,gitName=CI,gitEmail=ci@example.com" \
              < home/dot_zshrc.tmpl
            chezmoi execute-template \
              --init --promptString "profile=$profile,gitName=CI,gitEmail=ci@example.com" \
              < home/dot_config/helix/languages.toml.tmpl
          done
