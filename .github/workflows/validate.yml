name: Validate devlab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint install.sh
        run: shellcheck install.sh

  chezmoi-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: Render templates for both profiles
        # Two-step: `chezmoi init` runs home/.chezmoi.toml.tmpl (which calls
        # promptStringOnce) to produce a config file with [data] (profile,
        # gitName, gitEmail); then `execute-template --config <that>` renders
        # the data templates with those keys populated. `execute-template --init`
        # alone does NOT evaluate the config template, so .profile would be
        # missing (verified). --promptString matches by prompt TEXT.
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          for profile in dc1 vps; do
            echo "=== profile: $profile ==="
            cfg="$(mktemp -d)/chezmoi.toml"
            chezmoi init --source home --config-path "$cfg" \
              --promptString "Perfil (dc1|vps)=$profile" \
              --promptString "Nombre para git=CI" \
              --promptString "Email para git=ci@example.com"
            chezmoi execute-template --source home --config "$cfg" \
              < home/dot_zshrc.tmpl > /dev/null
            chezmoi execute-template --source home --config "$cfg" \
              < home/dot_config/helix/languages.toml.tmpl > /dev/null
            echo "render OK"
          done
