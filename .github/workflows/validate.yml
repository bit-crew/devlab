name: Validate Nix Flake

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Check flake evaluates
        run: nix flake metadata

      - name: Check server config
        run: nix build .#homeConfigurations.server.config.system --dry-run

      - name: Check tablet config
        run: nix build .#homeConfigurations.tablet.config.system --dry-run